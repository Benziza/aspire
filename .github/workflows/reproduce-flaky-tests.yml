# Reproduces flaky tests by running them repeatedly across multiple OS runners.
#
# HOW TO USE:
# 1. Edit the CONFIGURATION section below with the test you want to reproduce
# 2. Push to your branch
# 3. Trigger: gh workflow run reproduce-flaky-tests.yml --repo microsoft/aspire --ref <your-branch>
# 4. Check the results across OSes and runners
#
# The configuration is designed to be edited by agents (Copilot, etc.)
# who modify the env vars below and push to trigger a run.

name: Reproduce Flaky Tests

on:
  workflow_dispatch:
    inputs:
      runners_per_arm:
        description: Number of fresh Windows runners for each experiment arm
        required: false
        default: "36"

permissions:
  contents: read
  checks: write

# ============================================================
# CONFIGURATION — Edit these values to customize the test run
# ============================================================
env:
  # Test project shortname (maps to tests/Aspire.{name}.Tests/ or tests/{name}.Tests/)
  # Examples: Hosting, Core, Dashboard, Components.Common, Cli.EndToEnd
  TEST_PROJECT: "Hosting"

  # The arms run concurrently so they share runner-pool and time-of-day effects.
  RUNNERS_PER_ARM: ${{ inputs.runners_per_arm }}

jobs:

  setup:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      is_cli_e2e: ${{ steps.detect_cli_e2e.outputs.is_cli_e2e }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          ERRORS=0

          if ! [[ "${{ env.RUNNERS_PER_ARM }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::RUNNERS_PER_ARM must be a positive integer, got '${{ env.RUNNERS_PER_ARM }}'"
            ERRORS=1
          fi

          if [[ $ERRORS -ne 0 ]]; then exit 1; fi

      - name: Detect CLI E2E project
        id: detect_cli_e2e
        shell: bash
        run: |
          if [ "${{ env.TEST_PROJECT }}" = "Cli.EndToEnd" ]; then
            echo "is_cli_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_cli_e2e=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate runner matrix
        id: generate
        shell: bash
        run: |
          RUNNERS=${{ env.RUNNERS_PER_ARM }}
          MATRIX=$(jq -cn \
            --argjson runners "$RUNNERS" \
            '{include: [
              range(1; $runners + 1) as $index |
              [
                "GUARDED-WITHURLS",
                "GUARDED-HOSTING1"
              ][] as $arm |
              {
                os: "windows-latest",
                index: $index,
                arm: $arm
              }
            ]}')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

          TOTAL=$((RUNNERS * 2))
          echo "Generated matrix: $TOTAL Windows runners across guarded WithUrls and Hosting-1 arms"
          echo "Each arm runs one test process on a fresh runner"

  build_dcp_experiment:
    name: Build DCP experiment binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DCP v0.26.4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/dcp
          ref: v0.26.4
          path: dcp

      - name: Build stock and guarded Windows binaries
        shell: bash
        run: |
          set -euo pipefail
          cd dcp
          make generate-grpc
          mkdir -p ../dcp-experiment/stock ../dcp-experiment/start-time-guard

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -o ../dcp-experiment/stock/dcp.exe ./cmd/dcp

          python3 - <<'PY'
          from pathlib import Path

          path = Path("pkg/process/process_util.go")
          source = path.read_text()
          needle = '''\
          \t\tnextPid := Uint32_ToPidT(uint32(current.Pid))
          \t\ttree = append(tree, ProcessHandle{nextPid, processIdentityTime(current)})

          \t\tchildren, childrenErr := current.Children()
          \t\tif childrenErr != nil {
          \t\t\t// If we fail to get the children, assume there are no children.
          \t\t\tchildren = []*ps.Process{}
          \t\t}

          \t\tnext = append(next, children...)
          '''
          replacement = '''\
          \t\tnextPid := Uint32_ToPidT(uint32(current.Pid))
          \t\tcurrentIdentityTime := processIdentityTime(current)
          \t\ttree = append(tree, ProcessHandle{nextPid, currentIdentityTime})

          \t\tchildren, childrenErr := current.Children()
          \t\tif childrenErr != nil {
          \t\t\t// If we fail to get the children, assume there are no children.
          \t\t\tchildren = []*ps.Process{}
          \t\t}

          \t\tfor _, child := range children {
          \t\t\t// Windows can retain a dead process's parent PID after that PID is reused.
          \t\t\t// A real child cannot have started before its parent.
          \t\t\tchildIdentityTime := processIdentityTime(child)
          \t\t\tif !currentIdentityTime.IsZero() && !childIdentityTime.IsZero() && childIdentityTime.Before(currentIdentityTime) {
          \t\t\t\tif guardLogPath := os.Getenv("DCP_PROCESS_TREE_GUARD_LOG"); guardLogPath != "" {
          \t\t\t\t\tcurrentName, currentNameErr := current.Name()
          \t\t\t\t\tif currentNameErr != nil {
          \t\t\t\t\t\tcurrentName = "<unknown>"
          \t\t\t\t\t}
          \t\t\t\t\tchildName, childNameErr := child.Name()
          \t\t\t\t\tif childNameErr != nil {
          \t\t\t\t\t\tchildName = "<unknown>"
          \t\t\t\t\t}
          \t\t\t\t\tguardLog, guardLogErr := os.OpenFile(guardLogPath, os.O_APPEND|os.O_CREATE|os.O_WRONLY, 0o600)
          \t\t\t\t\tif guardLogErr != nil {
          \t\t\t\t\t\tfmt.Fprintf(os.Stderr, "failed to open process-tree guard log %q: %v\\n", guardLogPath, guardLogErr)
          \t\t\t\t\t} else {
          \t\t\t\t\t\tfmt.Fprintf(
          \t\t\t\t\t\t\tguardLog,
          \t\t\t\t\t\t\t"%s parent=%s(%d) parent_start=%s rejected_child=%s(%d) child_start=%s\\n",
          \t\t\t\t\t\t\ttime.Now().UTC().Format(time.RFC3339Nano),
          \t\t\t\t\t\t\tcurrentName,
          \t\t\t\t\t\t\tcurrent.Pid,
          \t\t\t\t\t\t\tcurrentIdentityTime.Format(time.RFC3339Nano),
          \t\t\t\t\t\t\tchildName,
          \t\t\t\t\t\t\tchild.Pid,
          \t\t\t\t\t\t\tchildIdentityTime.Format(time.RFC3339Nano),
          \t\t\t\t\t\t)
          \t\t\t\t\t\tif guardLogCloseErr := guardLog.Close(); guardLogCloseErr != nil {
          \t\t\t\t\t\t\tfmt.Fprintf(os.Stderr, "failed to close process-tree guard log %q: %v\\n", guardLogPath, guardLogCloseErr)
          \t\t\t\t\t\t}
          \t\t\t\t\t}
          \t\t\t\t}
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tnext = append(next, child)
          \t\t}
          '''
          if source.count(needle) != 1:
              raise SystemExit("Expected one process-tree traversal block")
          path.write_text(source.replace(needle, replacement))
          PY
          gofmt -w pkg/process/process_util.go

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -o ../dcp-experiment/start-time-guard/dcp.exe ./cmd/dcp

      - name: Upload DCP experiment binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dcp-experiment
          path: dcp-experiment/
          if-no-files-found: error

  build_cli_e2e_image:
    name: Build CLI E2E Docker image
    needs: setup
    if: ${{ needs.setup.outputs.is_cli_e2e == 'true' }}
    uses: ./.github/workflows/build-cli-e2e-image.yml

  reproduce:
    name: "${{ matrix.arm }} / ${{ matrix.os }} #${{ matrix.index }}"
    needs: [setup, build_dcp_experiment, build_cli_e2e_image]
    if: >-
      ${{
        !cancelled() &&
        needs.setup.result == 'success' &&
        needs.build_dcp_experiment.result == 'success' &&
        (needs.build_cli_e2e_image.result == 'success' || needs.build_cli_e2e_image.result == 'skipped')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      EXPERIMENT_ARM: ${{ matrix.arm }}

    steps:
      - name: Setup vars (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "DOTNET_SCRIPT=./dotnet.sh" >> $GITHUB_ENV
          echo "BUILD_SCRIPT=./build.sh" >> $GITHUB_ENV
          echo "${{ github.workspace }}/.dotnet" >> $GITHUB_PATH

      - name: Setup vars (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "DOTNET_SCRIPT=.\dotnet.cmd" >> $env:GITHUB_ENV
          echo "BUILD_SCRIPT=.\build.cmd" >> $env:GITHUB_ENV
          echo "${{ github.workspace }}\.dotnet" >> $env:GITHUB_PATH

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust HTTPS development certificate (Linux)
        if: runner.os == 'Linux'
        run: |
          EXIT_CODE=0
          ${{ env.DOTNET_SCRIPT }} dev-certs https --trust || EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 4 ]; then
            echo "dev-certs https --trust failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
        env:
          WSL_INTEROP: ""

      - name: Verify Docker is running (Linux)
        if: runner.os == 'Linux'
        run: docker info

      - name: Download prebuilt CLI E2E Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-dotnet-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Download prebuilt CLI E2E Java Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-polyglot-java-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Download prebuilt CLI E2E polyglot Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-e2e-polyglot-image
          path: ${{ github.workspace }}/cli-e2e-image

      - name: Load prebuilt CLI E2E Docker image
        if: ${{ needs.setup.outputs.is_cli_e2e == 'true' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          eng/scripts/load-cli-e2e-images.sh \
            --image-dir "${{ github.workspace }}/cli-e2e-image" \
            --require-dotnet true \
            --require-polyglot true \
            --require-java true

      - name: Unlock macOS keychain
        if: runner.os == 'macOS'
        uses: ./.github/actions/unlock-macos-keychain

      - name: Compute test project path
        shell: pwsh
        run: |
          $testShortName = "${{ env.TEST_PROJECT }}"
          $projectPath1 = "${{ github.workspace }}/tests/$testShortName.Tests/$testShortName.Tests.csproj"
          $projectPath2 = "${{ github.workspace }}/tests/Aspire.$testShortName.Tests/Aspire.$testShortName.Tests.csproj"

          if (Test-Path -Path $projectPath1) {
              $projectPath = $projectPath1
          } elseif (Test-Path -Path $projectPath2) {
              $projectPath = $projectPath2
          } else {
              Write-Error "No test project found for shortname '$testShortName'. Looked at: $projectPath1, $projectPath2"
              exit 1
          }

          echo "TEST_PROJECT_PATH=$projectPath" >> $env:GITHUB_ENV
          Write-Host "Resolved test project: $projectPath"

      - name: Build test project
        run: >
          ${{ env.BUILD_SCRIPT }}
          -restore -ci -build
          -projects ${{ env.TEST_PROJECT_PATH }}
          /p:InstallBrowsersForPlaywright=false
          /p:RunQuarantinedTests=true

      - name: Shutdown build server (Windows)
        if: runner.os == 'Windows'
        run: ${{ env.DOTNET_SCRIPT }} build-server shutdown

      - name: Download DCP experiment binaries
        if: runner.os == 'Windows'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dcp-experiment
          path: ${{ github.workspace }}/dcp-experiment

      - name: Run test iterations (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.packages
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          # Skip default quarantine/outerloop exclusion filters so the target test can run
          SkipDefaultTestFilters: true
        run: |
          PASS=0
          FAIL=0
          ITERATIONS=${{ env.ITERATIONS_PER_RUNNER }}

          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::Iteration $i/$ITERATIONS"

            # Cleanup between iterations
            rm -rf "${{ github.workspace }}/testresults" 2>/dev/null || true
            pgrep -lf "dcp" 2>/dev/null | grep -E "\bdcp(\.exe|ctl)?\b" | awk '{print $1}' | while read pid; do
              kill -9 "$pid" 2>/dev/null || true
            done
            sleep 1

            # Run test (capture output for zero-test detection)
            ITER_OUTPUT="${{ github.workspace }}/iter-output-$i.log"
            set +e  # Disable errexit so pipefail doesn't abort before PIPESTATUS capture
            ${{ env.DOTNET_SCRIPT }} test --project "${{ env.TEST_PROJECT_PATH }}" \
              --no-restore \
              --no-build \
              -- \
              --timeout 10m \
              --results-directory "${{ github.workspace }}/testresults" \
              ${{ env.TEST_FILTER }} \
              2>&1 | tee "$ITER_OUTPUT"
            RESULT=${PIPESTATUS[0]}
            set -e

            # Detect zero-test runs (--ignore-exit-code 8 in Testing.targets masks exit code 8)
            if [ "$RESULT" -eq 0 ]; then
              if ! grep -qiE "total:\s*[1-9]" "$ITER_OUTPUT" 2>/dev/null; then
                echo "::error::Iteration $i: Zero tests executed. Verify TEST_FILTER and quarantine settings."
                RESULT=8
              fi
            fi
            rm -f "$ITER_OUTPUT"

            if [ "$RESULT" -eq 0 ]; then
              echo "✅ Iteration $i: PASS"
              PASS=$((PASS + 1))
            else
              echo "❌ Iteration $i: FAIL (exit $RESULT)"
              FAIL=$((FAIL + 1))
              mkdir -p "${{ github.workspace }}/all-results/failure-$i"
              cp -r "${{ github.workspace }}/testresults/"* "${{ github.workspace }}/all-results/failure-$i/" 2>/dev/null || true
            fi

            echo "::endgroup::"
          done

          echo ""
          echo "========================================"
          echo "Summary for runner #${{ matrix.index }} on ${{ matrix.os }}"
          echo "  Passed: $PASS / $ITERATIONS"
          echo "  Failed: $FAIL / $ITERATIONS"
          echo "========================================"

          if [ "$FAIL" -gt 0 ]; then exit 1; fi

      - name: Run test iterations (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 22
        shell: pwsh
        env:
          ASPIRE__TEST__DCPLOGBASEPATH: ${{ github.workspace }}/testresults/dcp
          NUGET_PACKAGES: ${{ github.workspace }}/.packages
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: 'netaspireci.azurecr.io'
          # Skip default quarantine/outerloop exclusion filters so the target test can run
          SkipDefaultTestFilters: true
          # Match the regular test workflow's mitigation for resource-constrained Windows runners.
          UseSharedCompilation: false
          ASPIRE_TEST_ACTIVITY_FILE: ${{ github.workspace }}/test-activity.log
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $pass = 0
          $fail = 0
          $watchdogToken = $env:GITHUB_TOKEN
          Remove-Item Env:GITHUB_TOKEN
          $dotnetPath = Get-Content "${{ github.workspace }}\artifacts\toolset\sdk.txt"
          $dotnetExe = Join-Path $dotnetPath "dotnet.exe"

          $computer = Get-CimInstance Win32_ComputerSystem
          $systemDrive = Get-PSDrive -Name D -ErrorAction SilentlyContinue
          Write-Host "Runner fingerprint: processors=$($computer.NumberOfLogicalProcessors), memoryBytes=$($computer.TotalPhysicalMemory), driveDBytes=$($systemDrive.Used + $systemDrive.Free), image=$env:ImageVersion"

          $iterations = 1
          switch ($env:EXPERIMENT_ARM) {
            "BUNDLED-CONTROL" {
              $filterArgs = @("--filter-class", "*.WithUrlsTests")
              $expectedTests = 35
            }
            "GUARDED-WITHURLS" {
              $env:DcpPublisher__CliPath = "${{ github.workspace }}\dcp-experiment\start-time-guard\dcp.exe"
              $env:DCP_PROCESS_TREE_GUARD_LOG = "${{ github.workspace }}\guard-events.log"
              $filterArgs = @("--filter-class", "*.WithUrlsTests")
              $expectedTests = 35
            }
            "GUARDED-HOSTING1" {
              $env:DcpPublisher__CliPath = "${{ github.workspace }}\dcp-experiment\start-time-guard\dcp.exe"
              $env:DCP_PROCESS_TREE_GUARD_LOG = "${{ github.workspace }}\guard-events.log"
              $filterArgs = @("--filter-trait", "Partition=1")
              $expectedTests = 27
            }
            default {
              throw "Unknown experiment arm '$env:EXPERIMENT_ARM'."
            }
          }

          for ($i = 1; $i -le $iterations; $i++) {
            Write-Host "::group::Iteration $i/$iterations"

            $processes = @(Get-Process)
            $handleCount = ($processes | Measure-Object -Property Handles -Sum).Sum
            Write-Host "Process snapshot before cleanup: total=$($processes.Count), handles=$handleCount, dotnet=$(@($processes | Where-Object ProcessName -eq 'dotnet').Count), dcp=$(@($processes | Where-Object ProcessName -Match '^dcp').Count), conhost=$(@($processes | Where-Object ProcessName -eq 'conhost').Count)"

            # Cleanup between iterations
            Remove-Item -Recurse -Force "${{ github.workspace }}/testresults" -ErrorAction SilentlyContinue
            Remove-Item $env:ASPIRE_TEST_ACTIVITY_FILE -ErrorAction SilentlyContinue
            Get-Process | Where-Object { $_.ProcessName -match '^dcp' -or $_.ProcessName -eq 'dotnet' } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1

            # Run test (capture output for zero-test detection)
            $iterOutput = Join-Path "${{ github.workspace }}" "iter-output-$i.log"
            $watchdogName = "runner-watchdog/${{ github.run_id }}/$env:EXPERIMENT_ARM/${{ matrix.index }}"
            $watchdogId = $null

            try {
              $headers = @{
                Accept = "application/vnd.github+json"
                Authorization = "Bearer $watchdogToken"
                "X-GitHub-Api-Version" = "2022-11-28"
              }
              $createPayload = @{
                name = $watchdogName
                head_sha = "${{ github.sha }}"
                status = "in_progress"
                started_at = (Get-Date).ToUniversalTime().ToString("o")
                output = @{
                  title = "[automated] Resource watchdog: $env:EXPERIMENT_ARM/${{ matrix.index }}"
                  summary = "[automated] Waiting for the first resource sample."
                }
              } | ConvertTo-Json -Depth 4
              $watchdog = Invoke-RestMethod `
                -Method Post `
                -Uri "${{ github.api_url }}/repos/${{ github.repository }}/check-runs" `
                -Headers $headers `
                -Body $createPayload `
                -ContentType "application/json"
              $watchdogId = $watchdog.id
              $env:HEARTBEAT_CHECK_RUN_ID = "$watchdogId"
              $env:HEARTBEAT_CHECK_NAME = "$env:EXPERIMENT_ARM/${{ matrix.index }}"
            }
            catch {
              Write-Host "::warning::Unable to create the out-of-band watchdog check: $_"
            }

            $heartbeatStartInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $heartbeatStartInfo.FileName = "dotnet"
            $heartbeatStartInfo.ArgumentList.Add("${{ github.workspace }}\tools\scripts\Heartbeat.cs")
            $heartbeatStartInfo.ArgumentList.Add("30")
            $heartbeatStartInfo.UseShellExecute = $false
            $heartbeatStartInfo.CreateNoWindow = $true
            $heartbeatStartInfo.Environment["GITHUB_TOKEN"] = $watchdogToken
            $heartbeatProcess = [System.Diagnostics.Process]::Start($heartbeatStartInfo)

            try {
              & $dotnetExe test --project "${{ env.TEST_PROJECT_PATH }}" `
                --no-restore `
                --no-build `
                -- `
                --ignore-exit-code 8 `
                --crashdump `
                --hangdump `
                --hangdump-type none `
                --hangdump-timeout 4m `
                --timeout 12m `
                --results-directory "${{ github.workspace }}/testresults" `
                @filterArgs `
                --filter-not-trait "quarantined=true" `
                --filter-not-trait "outerloop=true" *> $iterOutput
              $result = $LASTEXITCODE
            }
            finally {
              if ($heartbeatProcess -and !$heartbeatProcess.HasExited) {
                $heartbeatProcess | Stop-Process -Force -ErrorAction SilentlyContinue
              }

              if ($watchdogId) {
                try {
                  $conclusion = if ($result -eq 0) { "neutral" } else { "failure" }
                  $completePayload = @{
                    status = "completed"
                    conclusion = $conclusion
                    completed_at = (Get-Date).ToUniversalTime().ToString("o")
                  } | ConvertTo-Json
                  Invoke-RestMethod `
                    -Method Patch `
                    -Uri "${{ github.api_url }}/repos/${{ github.repository }}/check-runs/$watchdogId" `
                    -Headers $headers `
                    -Body $completePayload `
                    -ContentType "application/json" | Out-Null
                }
                catch {
                  Write-Host "::warning::Unable to complete the watchdog check: $_"
                }
              }
            }

            Get-Content $iterOutput

            # Detect zero-test runs (--ignore-exit-code 8 in Testing.targets masks exit code 8)
            if ($result -eq 0) {
              $content = Get-Content $iterOutput -Raw -ErrorAction SilentlyContinue
              $totalMatch = [regex]::Match($content, '(?i)total:\s*(\d+)')
              if (-not $totalMatch.Success -or [int]$totalMatch.Groups[1].Value -ne $expectedTests) {
                $actualTests = if ($totalMatch.Success) { $totalMatch.Groups[1].Value } else { "unknown" }
                Write-Host "::error::Iteration ${i}: Expected $expectedTests tests for $env:EXPERIMENT_ARM, but observed $actualTests."
                $result = 8
              }
            }
            Remove-Item $iterOutput -ErrorAction SilentlyContinue

            if ($result -eq 0) {
              Write-Host "✅ Iteration ${i}: PASS"
              $pass++
            } else {
              Write-Host "❌ Iteration ${i}: FAIL (exit $result)"
              $fail++
              $dest = "${{ github.workspace }}/all-results/failure-$i"
              New-Item -ItemType Directory -Path $dest -Force | Out-Null
              Copy-Item -Recurse "${{ github.workspace }}/testresults/*" $dest -ErrorAction SilentlyContinue
            }

            Write-Host "::endgroup::"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Summary for ${{ matrix.arm }} runner #${{ matrix.index }} on ${{ matrix.os }}"
          Write-Host "  Passed: $pass / $iterations"
          Write-Host "  Failed: $fail / $iterations"
          Write-Host "========================================"

          if ($fail -gt 0) { exit 1 }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failures-${{ matrix.arm }}-${{ matrix.os }}-${{ matrix.index }}
          path: all-results/
          if-no-files-found: ignore

      - name: Upload process-tree guard events
        if: ${{ always() && startsWith(matrix.arm, 'GUARDED-') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-events-${{ matrix.arm }}-${{ matrix.index }}
          path: guard-events.log
          if-no-files-found: ignore

  results:
    if: always()
    runs-on: ubuntu-latest
    name: Reproduce Results
    needs: [reproduce]
    steps:
      - name: Summary
        shell: bash
        run: |
          echo "## Reproduce Flaky Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test Project | \`${{ env.TEST_PROJECT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Experiment | Large-sample production-shaped DCP guard confirmation |" >> $GITHUB_STEP_SUMMARY
          echo "| OS | windows-latest |" >> $GITHUB_STEP_SUMMARY
          echo "| Runners per arm | ${{ env.RUNNERS_PER_ARM }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Arms | Guarded WithUrlsTests; guarded Hosting-1 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.reproduce.result }}" = "success" ]; then
            echo "### ✅ All iterations passed on all runners" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.reproduce.result }}" = "failure" ]; then
            echo "### ❌ Some runners reported failures" >> $GITHUB_STEP_SUMMARY
            echo "Check individual job logs and uploaded failure artifacts for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Reproduce job was ${{ needs.reproduce.result }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Close orphaned watchdog checks
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prefix="runner-watchdog/${{ github.run_id }}/"
          gh api --paginate \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
            --jq ".check_runs[] | select(.name | startswith(\"$prefix\")) | select(.status != \"completed\") | .id" |
          while read -r check_id; do
            [ -z "$check_id" ] && continue
            gh api --method PATCH \
              "repos/${{ github.repository }}/check-runs/$check_id" \
              -f status=completed \
              -f conclusion=neutral \
              -f completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          done

      - name: Fail if reproduce did not succeed
        if: ${{ needs.reproduce.result != 'success' }}
        run: exit 1
