name: GitHub Actions security analysis

on:
  push:
    branches: [main]
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The official zizmor action is not in the microsoft organization Actions allow-list.
      - name: Install Zizmor
        run: | # zizmor: ignore[adhoc-packages] - the package is pinned because the official action is blocked
          python3 -m pip install --disable-pip-version-check --no-cache-dir zizmor==1.30.1

      - name: Run Zizmor
        run: zizmor --no-progress --format sarif .github/actions/ .github/workflows/ > zizmor.sarif
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: zizmor
          sarif_file: zizmor.sarif
